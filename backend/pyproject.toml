[project]
name = "backend"
version = "0.1.0"
description = "Local knowledge base RAG backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
]
