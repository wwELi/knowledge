services:
  postgres:
    image: docker.m.daocloud.io/pgvector/pgvector:pg17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
      POSTGRES_DB: kb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    # 阿里云 ACR 镜像：docker compose up 优先用已有/可拉取的 image；
    # 本地重新构建用 docker compose up --build。tag 由 CI 固定为短 sha。
    image: crpi-xl3t7d13ry0xdv7c.cn-beijing.personal.cr.aliyuncs.com/ww_images/kb_backend:build-and-push
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://kb:kb@postgres:5432/kb
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.nofude.xyz/v1}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-small-zh-v1.5}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: crpi-xl3t7d13ry0xdv7c.cn-beijing.personal.cr.aliyuncs.com/ww_images/kb_web:build-and-push
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
